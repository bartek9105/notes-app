<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="12" cy="12" r="4" fill="currentColor" />
  <circle
    cx="12"
    cy="12"
    r="4"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-opacity="0.45"
  >
    <animate
      attributeName="r"
      from="4"
      to="10"
      dur="1.4s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="stroke-opacity"
      from="0.45"
      to="0"
      dur="1.4s"
      repeatCount="indefinite"
    />
  </circle>
</svg>
